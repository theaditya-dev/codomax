<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Blog – DevBlog</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-require-auth="true">

<div class="orb orb-purple"></div>
<div class="orb orb-blue"></div>

<!-- ===================== NAVBAR ===================== -->
<header class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="logo">Dev<span>Blog</span></a>

    <nav class="nav-links" id="navLinks">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
      <a href="create-blog.html" data-page="create-blog.html">Create Blog</a>
      <a href="login.html" data-page="login.html">Login</a>
      <a href="register.html" data-page="register.html">Register</a>
      <div class="nav-actions-mobile" id="navActionsMobile"></div>
    </nav>

    <div class="nav-actions" id="navActions"></div>

    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="editor-wrapper">
  <div class="container">
    <div class="glass editor-card fade-in">
      <h1 id="editorTitle">Create a New Story</h1>
      <p class="auth-subtitle">Share your knowledge with the developer community.</p>

      <form id="blogForm" novalidate>
        <div class="form-group">
          <label for="blogTitle">Blog Title</label>
          <input type="text" id="blogTitle" class="form-control" placeholder="Give your story a clear title">
          <div class="field-error" id="titleError"></div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label for="blogCategory">Category</label>
            <select id="blogCategory" class="form-control">
              <option value="">Select a category</option>
              <option value="Web Development">Web Development</option>
              <option value="JavaScript">JavaScript</option>
              <option value="Programming">Programming</option>
              <option value="AI">AI</option>
              <option value="Technology">Technology</option>
              <option value="Career">Career</option>
            </select>
            <div class="field-error" id="categoryError"></div>
          </div>

          <div class="form-group">
            <label for="blogCover">Cover Image URL <span style="font-weight:400;">(optional)</span></label>
            <input type="text" id="blogCover" class="form-control" placeholder="https://example.com/image.jpg">
          </div>
        </div>

        <div class="form-group">
          <label for="blogDescription">Short Description</label>
          <input type="text" id="blogDescription" class="form-control" placeholder="A one-line summary of your story">
          <div class="field-error" id="descError"></div>
        </div>

        <div class="form-group">
          <label for="blogContent">Blog Content</label>
          <textarea id="blogContent" class="form-control" placeholder="Write your story here..."></textarea>
          <div class="field-error" id="contentError"></div>
        </div>

        <div class="editor-actions">
          <button type="button" id="publishBtn" class="btn btn-primary">Publish Blog</button>
          <button type="button" id="draftBtn" class="btn btn-glass">Save Draft</button>
          <button type="button" id="cancelBtn" class="btn btn-outline">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
